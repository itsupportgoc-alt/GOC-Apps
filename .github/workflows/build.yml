# Builds the 5 GOC Builders Windows apps and publishes them (with auto-update files).
# Runs on every push to main, or by hand: Actions > "Build GOC apps" > Run workflow.
# Installed apps (v1.1.30 and newer) check https://lightgreen-rhinoceros-813705.hostingersite.com/updates/<app>.yml
# and update themselves. The files are uploaded there by FTP (repository secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD;
# the FTP account's folder is public_html/updates). FTP_SERVER is the FTP IP; the connection is TLS-encrypted. A GitHub release is also made (useful while the repo is public).
name: Build GOC apps

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Set version (every build is a newer version, so installed apps update)
        shell: bash
        run: npm version "1.1.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build one installer per build-*.json
        shell: bash
        run: |
          for c in build-*.json; do
            echo "=== $c ==="
            npx electron-builder --win nsis --x64 --publish never -c "$c"
          done

      - name: List files
        shell: bash
        run: ls -la dist

      - name: Upload update files to Hostinger (public_html/updates)
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::FTP secrets are missing - the update files were NOT uploaded to Hostinger"; exit 1
          fi
          up() { for t in 1 2 3; do curl -sS --fail --ssl-reqd --insecure --ftp-pasv --retry 2 --connect-timeout 30 -T "$1" --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/$2" && return 0; echo "retry $1"; sleep 10; done; return 1; }
          # the installers first, the small .yml files last: apps only see a new version once its installer is there
          for f in dist/*-Setup.exe dist/*-Setup.exe.blockmap; do echo "upload $f"; up "$f" "$(basename "$f")"; done
          up hosting/updates.htaccess .htaccess
          for c in home projects payroll materials concerns; do echo "upload $c.yml"; up "dist/$c.yml" "$c.yml"; done
          echo "Uploaded to Hostinger."

      - name: Check the update files on Hostinger
        shell: bash
        run: |
          for c in home projects payroll materials concerns; do
            v=$(curl -sS --fail "https://lightgreen-rhinoceros-813705.hostingersite.com/updates/$c.yml?t=$RANDOM" | sed -n 's/^version: //p')
            echo "$c.yml -> $v"; [ "$v" = "1.1.${{ github.run_number }}" ] || { echo "::error::$c.yml on Hostinger is not the new version"; exit 1; }
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: GOC Builders Apps v1.1.${{ github.run_number }}
          make_latest: true
          body: |
            ## GOC Builders - Windows apps (auto-update)

            | App | Download |
            |---|---|
            | **GOC Builders** (home page, all systems) | [GOC-Builders-Setup.exe](https://github.com/${{ github.repository }}/releases/latest/download/GOC-Builders-Setup.exe) |
            | Project Hub | [GOC-Projects-Setup.exe](https://github.com/${{ github.repository }}/releases/latest/download/GOC-Projects-Setup.exe) |
            | Payroll & Manpower | [GOC-Payroll-Setup.exe](https://github.com/${{ github.repository }}/releases/latest/download/GOC-Payroll-Setup.exe) |
            | Materials Monitoring | [GOC-Materials-Setup.exe](https://github.com/${{ github.repository }}/releases/latest/download/GOC-Materials-Setup.exe) |
            | Project Concerns | [GOC-Concerns-Setup.exe](https://github.com/${{ github.repository }}/releases/latest/download/GOC-Concerns-Setup.exe) |

            Installed apps update themselves: they download the new version in the background and install it when closed (or Help > Check for updates).
          files: |
            dist/*-Setup.exe
            dist/*-Setup.exe.blockmap
            dist/home.yml
            dist/projects.yml
            dist/payroll.yml
            dist/materials.yml
            dist/concerns.yml
